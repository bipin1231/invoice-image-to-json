[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Extract and validate invoice data from images via Groq vision"
requires-python = ">=3.12"
dependencies = [
    "fastapi<0.142",
    "groq>=1.7.0",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "uvicorn>=0.32",
    "pytest>=8.0",
]
